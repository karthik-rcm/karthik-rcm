# Pre-commit hooks (toolkit template, trimmed for this Markdown-only repo)
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # ============================================
  # House style
  # ============================================
  # Em dashes must not reach END USERS. Rendered UI only: JSX and markup, UI
  # string literals, .html, .mdx, i18n/locale JSON.
  #
  # Docs, plans, READMEs, commit messages, backend code, database content,
  # tests and code comments are all EXEMPT-BY-DESIGN, not an oversight. A gate
  # that fires on a planning doc or a code comment interrupts development to
  # fix something no customer will ever see, and a gate people resent gets
  # bypassed with --no-verify, which drops every other hook alongside it.
  # Prose style elsewhere stays guidance in .claude/rules/writing.md.
  #
  # The script does the fine-grained filtering (it skips comments, imports and
  # test files inside qualifying files); `files:` below is only a cheap first
  # pass. ADDED LINES ONLY, so existing UI copy is grandfathered and this is
  # adoptable today instead of failing the first commit anyone makes.
  #
  # setup.sh provisions the script to ~/.gravitas-toolkit/scripts/, not into
  # this repo, so resolve the toolkit copy first. The trailing `--` is
  # load-bearing: without it pre-commit's first filename lands in `$0`.
  - repo: local
    hooks:
      - id: no-em-dash
        name: No em dashes in UI text
        entry: bash -c 'S="$HOME/.gravitas-toolkit/scripts/check-em-dash.sh"; [ -f "$S" ] || S="scripts/check-em-dash.sh"; if [ -f "$S" ]; then bash "$S" "$@"; else echo "no-em-dash skipped (check-em-dash.sh not provisioned — run setup.sh)"; fi' --
        language: system
        files: (\.(tsx|jsx|vue|svelte|astro|html|htm|mdx)$|^frontend/.*\.(ts|js|mjs|cjs|json|css|scss)$|/(i18n|locales|messages|translations)/.*\.json$)
        exclude: (/node_modules/|^(dist|build|out|coverage)/|/(dist|build|out|coverage)/|\.min\.(js|css)$|\.(test|spec)\.|/__tests__/|^(e2e|cypress|playwright)/)
        pass_filenames: true
        stages: [pre-commit, pre-push]

  # ============================================
  # Python Backend Hooks
  # ============================================

  # Ruff - Fast Python linter (replaces flake8, isort, pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --unsafe-fixes, --exit-non-zero-on-fix]
        files: ^backend/
        exclude: ^backend/alembic/versions_(OLD|VERIFIED)/
      # Formatter (replaces Black)
      - id: ruff-format
        files: ^backend/
        exclude: ^backend/alembic/versions_(OLD|VERIFIED)/

  # MyPy - Python type checking
  # Runs as local hook using the project's installed mypy (not isolated mirrors-mypy).
  # Currently non-blocking (|| true) — remove when error count reaches 0.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && python3 -m mypy app/ --config-file pyproject.toml --no-error-summary || true'
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false
        verbose: true

  # Bandit - Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-c, backend/pyproject.toml, --severity-level, medium, --confidence-level, medium]
        files: ^backend/app/
        exclude: ^backend/app/tests/

  # ============================================
  # Frontend Hooks (TypeScript/React)
  # ============================================

  # ESLint
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/src/.*\.tsx?$
        pass_filenames: false

  # Prettier
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (auto-format)
        entry: bash -c 'cd frontend && npm run format'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|scss|md)$
        pass_filenames: false

  # TypeScript type checking
  - repo: local
    hooks:
      - id: typescript
        name: TypeScript (type check)
        entry: bash -c 'cd frontend && npm run build:check'
        language: system
        files: ^frontend/src/.*\.tsx?$
        pass_filenames: false

  # ============================================
  # General Hooks (All files)
  # ============================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: ^frontend/node_modules/
      - id: check-yaml
        args: [--unsafe]
        exclude: ^(docker-compose.*\.yml|\.github/.*\.yml)$
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-json
        exclude: ^(frontend/node_modules/|frontend/tsconfig\.json|frontend/tsconfig\.node\.json|.*eslint-report\.json)
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^\.env\..*$
      - id: mixed-line-ending
        args: [--fix=lf]

  # ============================================
  # Secret Scanner — gitleaks
  # ============================================
  # Catches AWS access keys (AKIA...), JWTs, high-entropy strings near
  # identifiers like password/secret/token/key, and any custom rules in
  # .gitleaks.toml at the repo root.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ============================================
  # Docker & Infrastructure
  # ============================================

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009, --ignore, DL3018, --ignore, DL3006, --ignore, DL3042, --ignore, DL3003, --ignore, DL4006, --ignore, DL3045, --ignore, DL3015, --ignore, DL3059]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]
        files: \.(sh|bash)$

  # ============================================
  # Pre-Push Hooks
  # ============================================

  # mechanical-tests, service-tests and security-audit are omitted on purpose:
  # this repo has no backend/, no Docker and no scripts/local-ci-assist.py.

  # Code-agent standardization gate (runs on push, advisory by default)
  # An independent pre-push hook alongside local-ci — pre-commit runs every hook
  # even after one fails, so a single push surfaces BOTH verdicts. Ordered BEFORE
  # local-ci so local-ci's PASS/FAIL stays the final line the dev acts on.
  # Runs the toolkit-owned engine from the setup.sh-provisioned venv; skips
  # cleanly (exit 0) when the venv isn't provisioned yet, so the entry can land
  # before Story 3.1. Advisory by default (warnings_only); blocks only on a
  # confirmed BLOCKER under a repo's .agents/config.yml block_confirmed mode.
  # The gate renders type + file:line + severity only — never source snippets.
  - repo: local
    hooks:
      - id: code-agent
        name: Code-agent standardization (advisory)
        entry: bash -c 'P="$HOME/.gravitas-toolkit/code-agent-venv/bin/python"; if [ -x "$P" ]; then "$P" -m gate "$(pwd)"; else echo "code-agent skipped (engine venv not provisioned — run setup.sh)"; fi'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true

  # Local CI mirror (runs on push, blocking where scripts/local-ci.sh exists)
  # Mirrors the PR-blocking GitHub check so a red push is caught before it spends
  # Actions minutes. Skips cleanly where the per-repo script isn't generated yet.
  # [ -f ] tests presence (not the +x bit): a script that lost its executable bit
  # still runs via `bash` and still blocks on red, so a generation glitch can't
  # silently no-op the gate. "Disable" lives solely in `git push --no-verify`.
  - repo: local
    hooks:
      - id: local-ci
        name: Local CI (mirror of required GitHub check)
        entry: bash -c 'if [ -f scripts/local-ci.sh ]; then bash scripts/local-ci.sh; else echo "local-ci skipped (scripts/local-ci.sh not generated for this repo)"; fi'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true

# ============================================
# Configuration
# ============================================
default_install_hook_types: [pre-commit, commit-msg, pre-push]
fail_fast: false
minimum_pre_commit_version: '3.0.0'

exclude: |
  (?x)^(
      frontend/node_modules/.*|
      backend/alembic/versions/.*|
      backend/.venv/.*|
      backend/venv/.*|
      .*\.egg-info/.*|
      \.git/.*
  )$
